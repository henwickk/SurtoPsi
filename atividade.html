<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade</title>
    <link rel="stylesheet" href="css/ati.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <section id="lateral">
        <div id="title">
            <h1>PsicoDash</h1>
            <h6>Gestão atividades</h6>
        </div>

        <a href="pages/dashboard.html" class="animacao">Dashboard</a>
        <a href="" class="ativado">Registrar</a>
        <a href="" class="animacao">Atividades</a>






    </section>
    <aside id="cabecao"></aside>
    <section id="dash">
        <section class="op">
            <button class="opcx" id="openModal">
                <i class="bi bi-person-fill"></i>
                <h1>Individual</h1>
            </button>

            <button class="opcx" id="openModal2">
                <i class="bi bi-people-fill"></i>
                <h1>Coletivas</h1>
            </button>
        </section>
        <br>
        <section class="op">
            <button class="opcx" id="openModal3">
                <i class="bi bi-person-fill-gear"></i>
                <h1>Colaboradores</h1>
            </button>

            <button class="opcx" id="openModal4">
                <i class="bi bi-person-video3"></i>
                <h1>Sala de Aula</h1>
            </button>
        </section>
    </section>
    <div>
        <div id="overlay" class="overlay">
            <div class="modal">
                <h2>Registro Individual</h2>
                <p>
                <Form>
                    <label>Nome:</label><br>
                    <input type="text"><br>

                    <label>Data:</label><br>
                    <input type="date"><br>

                    <label for="">Horário:</label><br>
                    <input type="time"><br>

                    <label>Encaminhamento:</label><br>
                    <input type="text"><br>


                    <label for="">Observações:</label><br>
                    <textarea name="obs" id="obs"></textarea>

                </Form>
                </p>
                <button id="closeModal">Fechar</button>
            </div>
        </div>

        <div id="overlay2" class="overlay2">
            <div class="modal2">
                <h2>Registro Coletiva</h2>
                <form action="">
                    <label>Título:</label><br>
                    <input type="text"><br>

                    <label>Palestrantes:</label><br>
                    <input type="text"><br>

                    <label for="">Turmas:</label><br>
                    <input type="text"><br>

                    <label>Materiais:</label><br>
                    <input type="text"><br>

                    <button id="gerar">Gerar QR Code</button>
                    <div Id="qrcode"></div>

                </form>
                <button id="closeModal2">Fechar</button>
            </div>
        </div>

        <div id="overlay3" class="overlay3">
            <div class="modal3">
                <h2>Registro Colaborativo</h2>
                <form action="">
                    <label>Título:</label><br>
                    <input type="text"><br>

                    <label>Data:</label><br>
                    <input type="date"><br>

                    <label for="">Horário:</label><br>
                    <input type="time"><br>

                    <label>Colaboradores:</label><br>
                    <input type="text"><br>

                    <button id="gerar">Gerar QR Code</button>
                    <div id="qrcode2"></div>
                </form>
                <button id="closeModal3">Fechar</button>
            </div>
        </div>

        <div id="overlay4" class="overlay4">
            <div class="modal4">
                <h2>Meu Modal</h2>
                <p>Conteúdo do modal aqui.</p>
                <button id="closeModal4">Fechar</button>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script/script.js"></script>
</body>

</html>
