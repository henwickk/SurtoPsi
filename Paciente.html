<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paciente</title>
    <link rel="stylesheet" href="css/paci.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <section id="lateral">
        <div id="title">
            <h1>PsicoDash</h1>
            <h6>Gestão atividades</h6>
        </div>

        <a href="pages/dashboard.html" class="animacao">Dashboard</a>
        <a href="" class="ativado">Registrar</a>
        <a href="" class="animacao">Atividades</a>






    </section>
    <aside id="cabecao"></aside>
    <section id="dash">
        <div id="formulario">
            <h2>REGISTRAR PACIENTE</h2>
            <form class="grade" id="grade">
                <label for="nome">NOME COMPLETO:</label>
                <input type="text" id="nome" name="nome" required><br>

                <label for="idade">IDADE:</label>
                <input type="text" id="idade" name="idade" required><br>

                <label for="genero">GÊNERO:</label>
                <select id="genero" name="genero" required>
                    <option value="">SELECIONE</option>
                    <option value="masculino">MASCULINO</option>
                    <option value="feminino">FEMININO</option>
                    <option value="outro">OUTRO</option>
                </select><br>

                <label for="contato">CONTATO:</label>
                <input type="tel" id="contato" name="contato" required><br>

                <label for="historico">DATA DE NASCIMENTO:</label>
                <input type="date" id="dtnascimento" name="nascimento"></input><br>

                <button type="submit" class="btn">REGISTRAR PACIENTE</button>
                <button type="reset" class="btn">LIMPAR FORMULÁRIO</button>
            </form>
        </div>
    </section>
</body>

</html>
